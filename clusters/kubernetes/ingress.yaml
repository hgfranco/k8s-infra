apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spotify-public
  namespace: spotify-now-playing
  annotations:
    alb.ingress.kubernetes.io/group.name: public-applications
    alb.ingress.kubernetes.io/load-balancer-name: kubernetes-public-apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /api/status
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - whatishenrylisteningto.com
  rules:
    - host: whatishenrylisteningto.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spotify-now-playing
                port:
                  number: 80
