apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: henryfranco
  namespace: henryfranco
  annotations:
    alb.ingress.kubernetes.io/group.name: public-applications
    alb.ingress.kubernetes.io/load-balancer-name: kubernetes-public-apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - henryfranco.dev
        - henryfranco.com
  rules:
    - host: henryfranco.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: henryfranco-dev
                port:
                  number: 80
    - host: henryfranco.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: henryfranco-dev
                port:
                  number: 80
